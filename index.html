  /* ---------------- 统计 ---------------- */

  function donutSVG(cats, total) {
    const radius = 62;
    const circumference = 2 * Math.PI * radius;
    let offset = 0;
    const arcs = cats.map((c) => {
      const raw = total > 0 ? (c.value / total) * circumference : 0;
      const len = Math.max(raw - 3, 0);
      const dash = len + ' ' + (circumference - len);
      const el = '<circle cx="80" cy="80" r="' + radius + '" fill="none" stroke="' + c.color + '" stroke-width="17" stroke-linecap="round" stroke-dasharray="' + dash + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 80 80)"/>';
      offset += raw;
      return el;
    }).join('');
    return '<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="支出构成环形图">' + arcs +
      '<text x="80" y="72" text-anchor="middle" class="donut-label">本月支出</text>' +
      '<text x="80" y="96" text-anchor="middle" class="donut-total">' + moneySmart(total) + '</text>' +
    '</svg>';
  }

  function last7(key) {
    const list = txOf(key);
    let end;
    if (key === monthKey()) {
      end = new Date(todayISO() + 'T12:00:00');
    } else {
      const parts = key.split('-').map(Number);
      end = new Date(parts[0], parts[1], 0, 12, 0, 0);
    }
    const out = [];
    for (let i = 6; i >= 0; i -= 1) {
      const d = new Date(end);
      d.setDate(end.getDate() - i);
      const isoStr = monthKey(d).slice(0, 4) + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      const value = list.filter((t) => t.date === isoStr && t.type === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      out.push({ date: isoStr, label: (d.getMonth() + 1) + '/' + d.getDate(), value: value });
    }
    return out;
  }

  function statsNote(cats, expense, budget, key, budgetCats) {
    const label = monthLabel(key);
    if (!cats.length) return label + '还没有支出记录。等第一笔记下来，噜噜就帮你看看钱都去哪儿了。';
    const over = (budgetCats || []).filter(function (c) { return c.over; })[0];
    if (over) return '「' + over.name + '」已经超了 ' + moneySmart(over.spent - over.budget) + '（预算 ' + moneySmart(over.budget) + '，已用 ' + moneySmart(over.spent) + '）。先把这一项的非必要消费停一周试试。';
    if (!budget) return label + '花了 ' + moneySmart(expense) + '，最大的一头是' + cats[0].name + '（' + moneySmart(cats[0].value) + '，占 ' + Math.round(cats[0].pct * 100) + '%）。去「我的」设一个月预算，我就能帮你盯紧一点。';
    if (expense > budget) return '预算超了 ' + moneySmart(expense - budget) + '，最大的一头是' + cats[0].name + '。先把这一项的非必要消费停一周试试。';
    if (expense / budget > 0.8) return '预算用了 ' + Math.round((expense / budget) * 100) + '%，最大的一头是' + cats[0].name + '（' + moneySmart(cats[0].value) + '）。剩下几天可以把' + cats[0].name + '的单笔上限压低一点。';
    return label + '预算还剩 ' + moneySmart(budget - expense) + '，花得最多的是' + cats[0].name + '（' + moneySmart(cats[0].value) + '，占 ' + Math.round(cats[0].pct * 100) + '%）。目前节奏很稳，继续保持。';
  }

  function categoryBudgetCard(budgetCats) {
    if (!budgetCats.length) {
      return '<section class="card reveal" style="--d:6">' +
        '<div class="section-head"><h2>分类预算</h2><span>还没设置</span></div>' +
        '<p class="hint">给餐饮、交通这些分类单独设一个月上限，噜噜就能提前提醒你。去「我的 → 分类预算」设置。</p>' +
      '</section>';
    }
    return '<section class="card reveal" style="--d:6">' +
      '<div class="section-head"><h2>分类预算</h2><span>' + budgetCats.length + ' 项</span></div>' +
      '<div class="cat-budget-list">' + budgetCats.map(function (c) {
        const pctText = Math.round(c.pct * 100);
        const stateClass = c.over ? ' over' : (c.pct >= 0.85 ? ' warn' : '');
        return '<div class="cat-budget-row' + stateClass + '">' +
          '<div class="cat-budget-head"><span>' + c.name + '</span><b>' + moneySmart(c.spent) + ' / ' + moneySmart(c.budget) + '</b></div>' +
          '<div class="cat-budget-track"><i style="width:' + Math.min(Math.max(c.pct * 100, 0), 100) + '%;background:' + (c.over ? 'var(--danger)' : c.color) + '"></i></div>' +
          '<div class="cat-budget-meta"><span>' + pctText + '%</span><em>' + (c.over ? '超支 ' + moneySmart(c.spent - c.budget) : '还剩 ' + moneySmart(c.left)) + '</em></div>' +
        '</div>';
      }).join('') + '</div>' +
    '</section>';
  }

  function renderStats() {
    const key = state.month;
    const list = txOf(key);
    const t = totals(list);
    const allCats = categoryStats(list);
    const cats = foldCats(allCats, 5);
    const budget = Number(DB.settings.budget) || 0;
    const budgetCats = categoryBudgetStats(list);
    const days = last7(key);
    const maxDay = Math.max.apply(null, days.map((d) => d.value).concat([1]));
    const note = statsNote(allCats, t.expense, budget, key, budgetCats);

    return '<div class="page">' +
      '<header class="page-head reveal">' +
        '<div class="head-left">' +
          '<a class="icon-btn ghost" href="#/home" aria-label="返回首页">' + icon('back') + '</a>' +
          '<div><p class="eyebrow">看见钱的去向</p><h1>统计</h1></div>' +
        '</div>' +
        '<span class="head-seal">' + (ASSETS['avatar-celebrate'] ? '<img src="' + ASSETS['avatar-celebrate'] + '" alt="噜噜">' : mascot('mascot-coin')) + '</span>' +
      '</header>' +
      monthSwitcher(key) +
      '<section class="stat-summary reveal" style="--d:2">' +
        '<div class="stat-main"><span>本月支出</span><b>' + money(t.expense) + '</b></div>' +
        '<div class="stat-sub"><span>收入 <b>' + moneySmart(t.income) + '</b></span><span>结余 <b>' + moneySmart(t.balance) + '</b></span></div>' +
      '</section>' +

      '<section class="card chart-card reveal" style="--d:3">' +
        '<div class="section-head"><h2>支出构成</h2><span>' + (allCats.length ? allCats.length + ' 类' : '暂无') + '</span></div>' +
        (allCats.length ? '<div class="donut-wrap">' + donutSVG(cats, t.expense) +
          '<div class="legend">' + cats.map((c) => {
            return '<div class="legend-row"><i style="background:' + c.color + '"></i><span>' + c.name + '</span><b>' + moneySmart(c.value) + '</b><em>' + Math.round(c.pct * 100) + '%</em></div>';
          }).join('') + '</div></div>' : emptyState('还没有支出可以分析', '记几笔之后，这里会长出图表', 'mascot-sleep', 'empty-sleep')) +
      '</section>' +

      '<section class="card reveal" style="--d:4">' +
        '<div class="section-head"><h2>近 7 天</h2><span>每天花了多少</span></div>' +
        '<div class="bars">' + days.map((d) => {
          const h = Math.round((d.value / maxDay) * 100);
          return '<div class="bar-col" title="' + d.label + ' 支出 ' + moneySmart(d.value) + '">' +
            '<span class="bar-value">' + (d.value ? amountSmart(d.value) : '') + '</span>' +
            '<span class="bar-track"><i style="height:' + (d.value ? Math.max(h, 6) : 2) + '%"></i></span>' +
            '<span class="bar-label">' + d.label + '</span></div>';
        }).join('') + '</div>' +
      '</section>' +

      '<section class="card reveal" style="--d:5">' +
        '<div class="section-head"><h2>花得最多</h2><span>Top ' + cats.length + '</span></div>' +
        (cats.length ? '<div class="rank-list">' + cats.map((c, i) => {
          const w = cats[0].value > 0 ? Math.round((c.value / cats[0].value) * 100) : 0;
          return '<div class="rank-row"><span class="rank-index">' + pad2(i + 1) + '</span>' +

  function lastExportLabel() {
    const iso = String(DB.settings.lastExportAt || '');
    if (!iso) return '从未备份';
    const t = Date.parse(iso);
    if (isNaN(t)) return '从未备份';
    const d = new Date(t);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function needsBackup() {
    const iso = String(DB.settings.lastExportAt || '');
    if (!iso) return true;
    const t = Date.parse(iso);
    if (isNaN(t)) return true;
    return Date.now() - t > 30 * 24 * 60 * 60 * 1000;
  }

  function saveHeroEdit() {
    const incomeEl = $('#edit-income');
    const budgetEl = $('#edit-budget');
    if (!incomeEl || !budgetEl) return;
    const incomeVal = parseFloat(incomeEl.value);
    const budgetVal = parseFloat(budgetEl.value);
    if (isNaN(incomeVal) || incomeVal < 0) {
      toast('本月收入要填一个不小于 0 的数字', 'mascot-sleep');
      return;
    }
    if (isNaN(budgetVal) || budgetVal < 0) {
      toast('月预算要填一个不小于 0 的数字', 'mascot-sleep');
      return;
    }

    DB.settings.budget = Math.round(budgetVal * 100) / 100;

    const key = monthKey();
    const currentIncome = totals(txOf(key)).income;
    if (Math.abs(incomeVal - currentIncome) > 0.005) {
      const adjustments = DB.transactions.filter(function (t) {
        return String(t.date).slice(0, 7) === key && t.type === 'income' && t.note === '本月收入调整';
      });
      const regular = currentIncome - adjustments.reduce(function (s, t) {
        return s + (Number(t.amount) || 0);
      }, 0);
      DB.transactions = DB.transactions.filter(function (t) {
        return adjustments.indexOf(t) < 0;
      });
      const delta = Math.round((incomeVal - regular) * 100) / 100;
      if (Math.abs(delta) > 0.005) {
        DB.transactions.push({
          id: 'income-adj-' + key + '-' + Date.now().toString(36),
          type: 'income',
          amount: delta,
          category: 'other-income',
          note: '本月收入调整',
          date: todayISO(),
          time: nowTime(),
          createdAt: Date.now()
        });
      }
    }

    persist();
    closeSheet();
    refresh();
    toast('本月收入与预算更新啦');
  }

  function keyPress(key) {
    const d = state.draft;
    if (!d) return;
    if (key === 'back') {
      d.amount = d.amount.slice(0, -1);
    } else if (key === 'clear') {
      d.amount = '';
    } else if (key === '.') {
      if (d.amount.indexOf('.') < 0) d.amount = (d.amount || '0') + '.';
    } else if (key === '00') {
      if (d.amount && d.amount.indexOf('.') < 0 && d.amount.length < 7) d.amount += '00';
    } else {
      const parts = d.amount.split('.');
      if (parts[1] && parts[1].length >= 2) return;
      if (d.amount.replace('.', '').length >= 9) return;
      d.amount = d.amount === '0' ? key : d.amount + key;
    }
    const el = $('#amount-value');
    if (el) el.textContent = d.amount || '0';
    const box = $('#amount-box');
    if (box && d.amount) {
      box.classList.remove('shake');
      void box.offsetWidth;
    }
  }

      setTimeout(() => { root.innerHTML = ''; }, 280);

  function saveTx() {

      if (box) {
        box.classList.remove('shake');
        void box.offsetWidth;

    const payload = {
      type: d.type,
      amount: Math.round(amount * 100) / 100,
      category: d.category,
      note: String(d.note || '').trim(),
      date: d.date || todayISO(),
      time: d.mode === 'edit' ? d.time : nowTime()
    };
    if (d.mode === 'edit') {
      const t = DB.transactions.filter((x) => x.id === d.id)[0];
      if (t) Object.assign(t, payload);
    } else {
      payload.id = uid();
      payload.createdAt = Date.now();
      DB.transactions.push(payload);
    }
    persist();
    closeSheet();
    if (routeName() === 'bills' || routeName() === 'stats') state.month = String(payload.date).slice(0, 7);

  async function sendChat(raw) {
    const text = String(raw || '').trim();

    DB.chat.push({ role: 'user', text: text, time: nowTime() });
    API.saveDB(DB);

    if (input) {
      input.value = '';
      input.style.height = 'auto';

    renderChatBody();
    appendTyping();

    try {
      const res = await API.askLulu({
        messages: DB.chat.slice(-12),
        tone: DB.settings.tone,
        settings: DB.settings,
        context: buildContext()
      });
      removeTyping();
      let note = res.note || '';
      if (res.source === 'demo' && note.indexOf('本地演示回复') === 0) {
        const seen = DB.chat.some(function (m) {
          return m.role === 'assistant' && m.note && m.note.indexOf('本地演示回复') === 0;
        });
        if (seen) note = '';
      }
      DB.chat.push({
        role: 'assistant',
        text: res.text,
        time: nowTime(),
        source: res.source,
        note: note
      });
    } catch (err) {
      removeTyping();
      DB.chat.push({
        role: 'assistant',
        text: '我这边暂时连不上 DeepSeek。可以检查一下 Key，或者在「我的」里打开演示回复。',

  function resizeImage(file, size) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const s = Math.min(img.width, img.height);
          const sx = (img.width - s) / 2;
          const sy = (img.height - s) / 2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.86));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function handleUpload(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const who = input.dataset.upload;
    resizeImage(file, 200).then(function (dataUrl) {
      DB.settings[who === 'ai' ? 'aiAvatar' : 'meAvatar'] = { kind: 'upload', id: null, dataUrl: dataUrl };
      if (!API.saveDB(DB)) toast('图片有点大，没能存下来，换一张试试', 'mascot-sleep');
      refresh();
      toast('头像换好啦');
    }).catch(function () {

    });
  }

  async function exportData() {
    const payload = API.exportPayload(DB);
    const json = JSON.stringify(payload, null, 2);
    const filename = 'lulu-ledger-' + todayISO() + '.json';
    const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

    const done = function (text) {
      API.markExported(DB);
      if (routeName() === 'me') refresh();
      toast(text);
    };

    // iPhone 上优先用系统分享，存进「文件」
    if (coarse && navigator.canShare && typeof File !== 'undefined') {
      try {
        const file = new File([json], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: '噜噜记账备份' });
          done('备份已经交给系统保存');
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }

    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
    done('备份已经下载好啦');
  }

  function handleImport(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const payload = JSON.parse(String(reader.result || ''));
        const keepKey = DB.settings.apiKey;
        const keepProxy = DB.settings.proxyUrl;
        const keepModel = DB.settings.model;
        DB = API.importPayload(payload);
        DB.settings.apiKey = keepKey;
        DB.settings.proxyUrl = keepProxy;
        DB.settings.model = keepModel;
        const saved = API.saveDB(DB);
        state.month = monthKey();
        render(false);
        toast(saved ? '备份恢复好啦' : '导入成功，但本地保存失败，请立即导出备份', saved ? undefined : 'mascot-sleep');
      } catch (e) {
        toast('这个备份文件读不出来', 'mascot-sleep');
      }
      input.value = '';
    };
    reader.onerror = function () {
      toast('文件读取失败，换一个试试', 'mascot-sleep');
      input.value = '';
    };
    reader.readAsText(file);
  }

  /* ---------------- 路由与事件 ---------------- */

  function routeName() {
    const h = String(location.hash || '').replace(/^#\/?/, '');
    return ['home', 'bills', 'stats', 'me', 'chat'].indexOf(h) >= 0 ? h : 'home';
  }

  function setActive(route) {
    document.body.dataset.page = route;
    $$('[data-nav]').forEach(function (el) {
      const on = el.dataset.nav === route;
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  }

  function render(keepScroll) {
    const route = routeName();
    if (route !== 'chat') state.lastRoute = route;
    setActive(route);
    document.body.classList.toggle('chat-mode', route === 'chat');
    const view = $('#view');
    const prevTop = view ? view.scrollTop : 0;
    if (route === 'bills') view.innerHTML = renderBills();
    else if (route === 'stats') view.innerHTML = renderStats();
    else if (route === 'me') view.innerHTML = renderMe();
    else if (route === 'chat') view.innerHTML = renderChat();
    else view.innerHTML = renderHome();

    if (!keepScroll) {
      window.scrollTo(0, 0);
      if (view) view.scrollTop = 0;
    } else if (view) {
      view.scrollTop = prevTop;
    }
    if (route === 'chat') fitChatToViewport();
  }

  function refresh() {
    render(true);
  }

  document.addEventListener('click', function (e) {
    const keyEl = e.target.closest('[data-key]');
    if (keyEl && state.draft) {
      keyPress(keyEl.dataset.key);
      return;
    }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case 'open-add':
        e.preventDefault();
        openAdd({ type: 'expense' });
        break;
      case 'open-hero-edit':
        e.preventDefault();
        openHeroEdit();
        break;
      case 'save-hero-edit':
        e.preventDefault();
        saveHeroEdit();
        break;
      case 'quick-add':
        e.preventDefault();
        openAdd({ type: 'expense', category: el.dataset.category });
        break;
      case 'open-edit':
        e.preventDefault();
        openEdit(el.dataset.id);
        break;
      case 'close-sheet':
        closeSheet();
        break;
      case 'sheet-type':
        syncSheetFields();
        state.draft.type = el.dataset.type;
        state.draft.category = typeCats(el.dataset.type)[0].id;
        renderSheet();
        break;
      case 'sheet-category':
        if (!state.draft) break;
        state.draft.category = el.dataset.id;
        $$('.cat-choice').forEach(function (c) {
          c.classList.toggle('active', c.dataset.id === el.dataset.id);
        });
        break;
      case 'save-tx':
        e.preventDefault();
        saveTx();
        break;
      case 'delete-tx':
        e.preventDefault();
        if (state.draft && state.draft.id) askDeleteTx(state.draft.id);
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'month-shift':
        state.month = shiftMonth(state.month, Number(el.dataset.delta));
        state.query = '';
        state.catFilter = 'all';
        state.filter = 'all';
        refresh();
        break;
      case 'filter-type':
        state.filter = el.dataset.type;
        renderBillResults();
        break;
      case 'bill-cat':
        state.catFilter = el.dataset.id;
        renderBillResults();
        break;
      case 'bill-search-clear': {
        state.query = '';
        const input = $('#bill-search');
        if (input) {
          input.value = '';
          input.focus();
        }
        const clear = $('.bill-search-clear');
        if (clear) clear.hidden = true;
        renderBillResults();
        break;
      }
      case 'bill-clear-all': {
        state.query = '';
        state.catFilter = 'all';
        state.filter = 'all';
        const input = $('#bill-search');
        if (input) input.value = '';
        const clear = $('.bill-search-clear');
        if (clear) clear.hidden = true;
        renderBillResults();
        break;
      }
      case 'pick-avatar': {
        const who = el.dataset.who;
        if (who === 'ai') DB.settings.aiAvatar = { kind: 'preset', id: el.dataset.id };
        else DB.settings.meAvatar = { kind: 'preset', id: el.dataset.id };
        persist();
        refresh();
        break;
      }
      case 'pick-tone': {
        DB.settings.tone = el.dataset.id;
        persist();
        refresh();
        toast('噜噜换成「' + API.toneOf(el.dataset.id).name + '」语气啦');
        break;
      }
      case 'test-connection':
        runConnectionTest(el);
        break;
      case 'export-data':
        exportData();
        break;
      case 'reset-demo':
        confirmDialog({
          title: '恢复演示账单？',
          desc: '现在的账单会被演示数据替换，设置和头像会保留。',
          confirmText: '恢复',
          onConfirm: function () {
            API.resetTransactions(DB);
            API.saveDB(DB);
            refresh();
            toast('演示账单回来啦');
          }
        });
        break;
      case 'clear-data':
        confirmDialog({
          title: '清空所有账单？',
          desc: '所有记账记录都会被删除，设置和头像会保留。删掉就找不回来了。',
          confirmText: '全部清空',
          danger: true,
          onConfirm: function () {
            API.clearTransactions(DB);
            API.saveDB(DB);
            refresh();
            toast('账单已经清空', 'mascot-sleep');
          }
        });
        break;
      case 'finish-onboard':
        finishOnboard(false);
        break;
      case 'skip-onboard':
        finishOnboard(true);
        break;
      case 'chat-back':
        location.hash = '#/' + (state.lastRoute || 'home');
        break;
      case 'chat-tone-toggle': {
        const panel = $('#chat-tone-panel');
        if (panel) panel.hidden = !panel.hidden;
        break;
      }
      case 'chat-tone': {
        DB.settings.tone = el.dataset.id;
        persist();
        const label = $('#chat-tone-label');
        if (label) label.textContent = '在线 · ' + API.toneOf(el.dataset.id).name;
        $$('#chat-tone-panel .chip').forEach(function (c) {
          c.classList.toggle('active', c.dataset.id === el.dataset.id);
        });
        const panel = $('#chat-tone-panel');
        if (panel) panel.hidden = true;
        toast('噜噜换成「' + API.toneOf(el.dataset.id).name + '」语气啦');
        break;
      }
      case 'chat-clear':
        confirmDialog({
          title: '清空聊天记录？',
          desc: '噜噜会忘记你们聊过什么，但账单不会受影响。',
          confirmText: '清空对话',
          danger: true,
          onConfirm: function () {
            DB.chat = [];
            API.saveDB(DB);
            renderChatBody();
            toast('聊天记录清空啦', 'mascot-sleep');
          }
        });
        break;
      case 'chat-suggest':
        sendChat(el.dataset.text);
        break;
      default:
        break;
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'chat-form') {
      e.preventDefault();
      const input = $('#chat-input');
      sendChat(input ? input.value : '');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChat(e.target.value);
      return;
    }
    if (state.draft) {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (!typing && /^[0-9.]$/.test(e.key)) {
        e.preventDefault();
        keyPress(e.key);
        return;
      }
      if (!typing && e.key === 'Backspace') {
        e.preventDefault();
        keyPress('back');
        return;
      }
    }
    if (e.key === 'Escape') {
      if ($('#modal-root').innerHTML) closeModal();
      else if ($('#sheet-root').innerHTML) closeSheet();
    }
  });

  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'chat-input') {
      t.style.height = 'auto';
      t.style.height = Math.min(t.scrollHeight, 120) + 'px';
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-bill-search')) {
      state.query = t.value;
      const clear = $('.bill-search-clear');
      if (clear) clear.hidden = !t.value;
      renderBillResults();
      return;
    }
    if (t.dataset && t.dataset.field === 'note' && state.draft) {
      state.draft.note = t.value;
    }
  });

  document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-import')) {
      handleImport(t);
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-upload')) {
      handleUpload(t);
      return;
    }
    if (t.dataset && t.dataset.field === 'date' && state.draft) {
      state.draft.date = t.value || todayISO();
      return;
    }
    if (t.dataset && t.dataset.catBudget) {
      const id = t.dataset.catBudget;
      const v = parseFloat(t.value);
      const budgets = DB.settings.categoryBudgets || {};
      if (!isFinite(v) || v <= 0) delete budgets[id];
      else budgets[id] = Math.round(v * 100) / 100;
      DB.settings.categoryBudgets = budgets;
      persist();
      return;
    }
    if (t.dataset && t.dataset.setting) {
      const key = t.dataset.setting;
      if (key === 'fallback') DB.settings.fallback = t.checked;
      else if (key === 'budget') {
        const v = parseFloat(t.value);
        DB.settings.budget = isNaN(v) ? 0 : v;
      } else {
        DB.settings[key] = t.value;
      }
      persist();
      if (key === 'nickname' || key === 'apiKey' || key === 'proxyUrl') {
        const pill = $('.status-pill');
        if (pill && (key === 'apiKey' || key === 'proxyUrl')) {
          const on = !!(String(DB.settings.apiKey || '').trim() || String(DB.settings.proxyUrl || '').trim());
          pill.textContent = on ? '已配置' : '演示模式';
          pill.classList.toggle('on', on);
        }
      }
    }
  });

  window.addEventListener('hashchange', function () {
    render(false);
  });

  /* ---------------- 启动 ---------------- */

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitChatToViewport);
    window.visualViewport.addEventListener('scroll', fitChatToViewport);
  }
  window.addEventListener('resize', fitChatToViewport);

  render(false);
  if (DB.meta && DB.meta.restoredFromBackup) {
    setTimeout(function () {
      toast('检测到上次保存异常，已从本地快照恢复；建议现在导出一份备份。', 'mascot-sleep');
    }, 900);
  }
  if (!DB.settings.onboarded) {
    setTimeout(openOnboard, 420);
  }
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
